# fly.toml app configuration file generated for kurdstream-backend-kv23sw on 2026-07-25T19:12:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kurdstream-backend-kv23sw'
primary_region = 'ams'

[build]

[env]
  DATA_DIR = '/app/data'

[[mounts]]
  source = 'kurdstream_data'
  destination = '/app/data'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
